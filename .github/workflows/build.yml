name: Build AMOS Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            arch: aarch64
            suffix: aarch64
            target: aarch64-apple-darwin
          - platform: macos-14
            arch: x86_64
            suffix: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust targets
        if: matrix.arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Find DMG
        id: find-dmg
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" -type f | grep bundle | head -1)
          echo "dmg_path=$DMG" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ -z "$VERSION" ] && VERSION="0.2.0"
          ARCH=${{ matrix.suffix }}
          aws s3 cp "${{ steps.find-dmg.outputs.dmg_path }}" "s3://amos-releases/companion/AMOS_Companion_${VERSION}_${ARCH}.dmg" \
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" \
            --region auto \
            --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Find AppImage
        id: find-appimage
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" -type f | grep bundle | head -1)
          echo "appimage_path=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "Found AppImage: $APPIMAGE"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ -z "$VERSION" ] && VERSION="0.2.0"
          aws s3 cp "${{ steps.find-appimage.outputs.appimage_path }}" "s3://amos-releases/companion/AMOS_Companion_${VERSION}_amd64.AppImage" \
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" \
            --region auto \
            --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Find MSI
        id: find-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path src-tauri/target -Filter "*.msi" -Recurse | Where-Object { $_.FullName -match "bundle" } | Select-Object -First 1
          echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found MSI: $($msi.FullName)"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          if (-not $version) { $version = "0.2.0" }
          aws s3 cp "${{ steps.find-msi.outputs.msi_path }}" "s3://amos-releases/companion/AMOS_Companion_${version}_x64-setup.exe" `
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" `
            --region auto `
            --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
