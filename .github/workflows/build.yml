name: Build AMOS Companion

on:
  push:
    tags:
      - "companion/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0)"
        required: false
        type: string

env:
  R2_ENDPOINT: "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com"
  R2_BUCKET: "amos-releases"
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
  AWS_DEFAULT_REGION: "auto"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: write

jobs:
  # Build for macOS (Intel and Apple Silicon)
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            arch: aarch64
            suffix: aarch64
            target: aarch64-apple-darwin
          - platform: macos-14
            arch: x86_64
            suffix: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust targets
        if: matrix.arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Install create-dmg
        run: |
          which create-dmg || brew install create-dmg

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Verify version sync
        run: bun run check:version

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Find DMG
        id: find-dmg
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" -type f | grep bundle | head -1)
          echo "dmg_path=$DMG" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG"

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /
          rm -f AWSCLIV2.pkg

      - name: Upload to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          ARCH=${{ matrix.suffix }}
          aws s3 cp "${{ steps.find-dmg.outputs.dmg_path }}" "s3://${{ env.R2_BUCKET }}/companion/AMOS_Companion_${VERSION}_${ARCH}.dmg" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: AMOS_Companion_${VERSION}_${ARCH}.dmg"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-dmg.outputs.dmg_path }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  # Build for Linux — AppImage + Portable Tarball (x86_64 + aarch64)
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            suffix: amd64
            setup: ""
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            suffix: arm64
            setup: |
              rustup target add aarch64-unknown-linux-gnu
              sudo apt-get install -y gcc-aarch64-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux build dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf unzip

      - name: Install Linux build dependencies (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf unzip gcc-aarch64-linux-gnu

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Verify version sync
        run: bun run check:version

      # ── Build AppImage ──────────────────────────────────────────────────────
      - name: Build Tauri app (AppImage)
        run: bun run tauri build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/aarch64-linux-gnu-gcc

      - name: Find AppImage
        id: find-appimage
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" -type f | grep bundle | head -1)
          echo "appimage_path=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "Found AppImage: $APPIMAGE"

      # ── Find .deb package ────────────────────────────────────────────────────
      - name: Find .deb package
        id: find-deb
        run: |
          DEB=$(find src-tauri/target -name "*.deb" -type f | grep bundle/deb | head -1)
          echo "deb_path=$DEB" >> $GITHUB_OUTPUT
          echo "Found .deb: $DEB"

      # ── Build Portable Tarball ──────────────────────────────────────────────
      - name: Find compiled binary
        id: find-binary
        run: |
          BINARY=$(find src-tauri/target/${{ matrix.rust_target }}/release -name "amos-companion" -type f 2>/dev/null | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find src-tauri/target/release -name "amos-companion" -type f 2>/dev/null | head -1)
          fi
          echo "binary_path=$BINARY" >> $GITHUB_OUTPUT
          echo "Binary: $BINARY"

      - name: Package portable tarball
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi

          ARCH="${{ matrix.suffix }}"
          TARBALL="amos-companion-${ARCH}-${VERSION}.tar.gz"
          SCRCPY_JAR="src-tauri/scrcpy-server/scrcpy-server.jar"

          echo "Packaging ${TARBALL}..."
          mkdir -p "dist/linux"

          # Copy binary
          cp "${{ steps.find-binary.outputs.binary_path }}" "dist/linux/amos-companion"
          chmod +x "dist/linux/amos-companion"

          # Copy scrcpy-server.jar if available
          if [ -n "$SCRCPY_JAR" ] && [ -f "$SCRCPY_JAR" ]; then
            cp "$SCRCPY_JAR" "dist/linux/scrcpy-server.jar"
          fi

          # Create tarball (only include scrcpy-server.jar if it exists)
          if [ -n "$SCRCPY_JAR" ] && [ -f "$SCRCPY_JAR" ]; then
            tar -czf "dist/linux/${TARBALL}" -C dist/linux amos-companion scrcpy-server.jar
          else
            tar -czf "dist/linux/${TARBALL}" -C dist/linux amos-companion
          fi

          # List contents
          tar -tzf "dist/linux/${TARBALL}"
          echo "TARBALL=dist/linux/${TARBALL}" >> $GITHUB_OUTPUT

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip >/dev/null 2>&1
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip aws

      - name: Upload AppImage to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          # Upload to version folder (like .deb and tarball) for consistent structure
          aws s3 cp "${{ steps.find-appimage.outputs.appimage_path }}" "s3://${{ env.R2_BUCKET }}/companion/${VERSION}/AMOS_Companion_${VERSION}_${{ matrix.suffix }}.AppImage" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: AMOS_Companion_${VERSION}_${{ matrix.suffix }}.AppImage"
          echo "Public URL: https://pub-a612420d2b9c409b9017805eabd46301.r2.dev/companion/${VERSION}/AMOS_Companion_${VERSION}_${{ matrix.suffix }}.AppImage"

      - name: Upload .deb package to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          if [ -n "${{ steps.find-deb.outputs.deb_path }}" ]; then
            aws s3 cp "${{ steps.find-deb.outputs.deb_path }}" "s3://${{ env.R2_BUCKET }}/companion/${VERSION}/amos-companion_${{ matrix.suffix }}_${VERSION}.deb" \
              --endpoint-url "${{ env.R2_ENDPOINT }}" \
              --region auto \
              --acl public-read
            echo "Uploaded: amos-companion_${{ matrix.suffix }}_${VERSION}.deb"
          else
            echo "No .deb found, skipping upload"
          fi

      - name: Upload Portable Tarball to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          TARBALL="dist/linux/amos-companion-${{ matrix.suffix }}-${VERSION}.tar.gz"
          aws s3 cp "$TARBALL" "s3://${{ env.R2_BUCKET }}/companion/${VERSION}/amos-companion-${{ matrix.suffix }}-${VERSION}.tar.gz" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: amos-companion-${{ matrix.suffix }}-${VERSION}.tar.gz"

      - name: Upload Install Script to R2
        run: |
          aws s3 cp "scripts/install.sh" "s3://${{ env.R2_BUCKET }}/companion/${VERSION}/install.sh" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          # Also upload to latest/ for VERSION=latest install.sh
          aws s3 cp "scripts/install.sh" "s3://${{ env.R2_BUCKET }}/companion/latest/install.sh" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: install.sh"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-appimage.outputs.appimage_path }}
            ${{ steps.find-binary.outputs.TARBALL }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  # Build for Windows (NSIS installer)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Verify version sync
        run: bun run check:version

      - name: Build Tauri app
        run: bun run tauri build

      - name: Find EXE Installer
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "bundle" -and $_.FullName -notmatch "WebView2" } | Select-Object -First 1
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found EXE: $($exe.FullName)"

      - name: Install AWS CLI
        shell: pwsh
        run: msiexec /i https://awscli.amazonaws.com/AWSCLIV2.msi /qn

      - name: Upload to R2
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $version = $version -replace "^companion/", ""
          $version = $version -replace "^v", ""
          if ("${{ inputs.version }}") {
            $version = "${{ inputs.version }}"
          }
          aws s3 cp "${{ steps.find-exe.outputs.exe_path }}" "s3://${{ env.R2_BUCKET }}/companion/AMOS_Companion_${version}_x64-setup.exe" `
            --endpoint-url "${{ env.R2_ENDPOINT }}" `
            --region auto `
            --acl public-read
          Write-Host "Uploaded: AMOS_Companion_${version}_x64-setup.exe"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-exe.outputs.exe_path }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  # ── Update version manifest ───────────────────────────────────────────────────
  update-manifest:
    needs: [build-linux, build-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip >/dev/null 2>&1
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip aws

      - name: Generate version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build manifest.json
        run: |
          # Install jq for JSON manipulation
          sudo apt-get update && sudo apt-get install -y jq

          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"

          # Build per-platform URLs (R2 public bucket URL) — AppImage now in version folder
          R2_PUBLIC="https://pub-a612420d2b9c409b9017805eabd46301.r2.dev/companion"
          APPIMAGE_AMD64="${R2_PUBLIC}/${VERSION}/AMOS_Companion_${VERSION}_amd64.AppImage"
          APPIMAGE_ARM64="${R2_PUBLIC}/${VERSION}/AMOS_Companion_${VERSION}_aarch64.AppImage"
          TAR_AMD64="${R2_PUBLIC}/${VERSION}/amos-companion-amd64-${VERSION}.tar.gz"
          TAR_ARM64="${R2_PUBLIC}/${VERSION}/amos-companion-arm64-${VERSION}.tar.gz"
          DEB_AMD64="${R2_PUBLIC}/${VERSION}/amos-companion_amd64_${VERSION}.deb"
          DEB_ARM64="${R2_PUBLIC}/${VERSION}/amos-companion_arm64_${VERSION}.deb"
          INSTALL_SH="${R2_PUBLIC}/${VERSION}/install.sh"

          # Download existing manifest to merge (ignore error if not exists)
          if aws s3 cp "s3://${{ env.R2_BUCKET }}/companion/latest/manifest.json" existing_manifest.json \
             --endpoint-url "${{ env.R2_ENDPOINT }}" --region auto 2>/dev/null; then
            echo "Merging with existing manifest..."
            # Use jq to merge new version into existing manifest
            # Add new version's data while keeping existing versions
            cat existing_manifest.json | \
              jq --arg v "${VERSION}" \
                 --arg tag "${TAG}" \
                 --arg amd64_app "${APPIMAGE_AMD64}" \
                 --arg arm64_app "${APPIMAGE_ARM64}" \
                 --arg amd64_tar "${TAR_AMD64}" \
                 --arg arm64_tar "${TAR_ARM64}" \
                 --arg amd64_deb "${DEB_AMD64}" \
                 --arg arm64_deb "${DEB_ARM64}" \
                 --arg inst_sh "${INSTALL_SH}" \
                 '.releases[$v] = {
                   "appimage": { "amd64": $amd64_app, "arm64": $arm64_app },
                   "tarball": { "amd64": $amd64_tar, "arm64": $arm64_tar },
                   "deb": { "amd64": $amd64_deb, "arm64": $arm64_deb },
                   "installScript": $inst_sh
                 } | .latest = $v | .tag = $tag | .released = (now | strftime("%Y-%m-%dT%H:%M:%SZ"))' \
              > manifest.json
          else
            echo "Creating new manifest..."
            printf '{"latest":"%s","tag":"%s","released":"%s","releases":{"%s":{"appimage":{"amd64":"%s","arm64":"%s"},"deb":{"amd64":"%s","arm64":"%s"},"tarball":{"amd64":"%s","arm64":"%s"},"installScript":"%s"}}}' \
              "${VERSION}" "${TAG}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              "${VERSION}" \
              "${APPIMAGE_AMD64}" "${APPIMAGE_ARM64}" \
              "${DEB_AMD64}" "${DEB_ARM64}" \
              "${TAR_AMD64}" "${TAR_ARM64}" \
              "${INSTALL_SH}" > manifest.json
          fi
          cat manifest.json

      - name: Upload manifest.json to R2
        run: |
          TAG="${{ github.ref_name }}"

          # Upload versioned manifest
          aws s3 cp manifest.json "s3://${{ env.R2_BUCKET }}/companion/${VERSION}/manifest.json" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read \
            --content-type application/json

          # Update latest manifest (always points to newest)
          aws s3 cp manifest.json "s3://${{ env.R2_BUCKET }}/companion/latest/manifest.json" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read \
            --content-type application/json

          echo "Manifest updated for version ${{ steps.version.outputs.version }}"

  # Cleanup old builds - keep only last 3 versions by version number
  # Run even if some builds fail, so we don't accumulate old versions
  cleanup:
    needs: [build-linux, build-windows, update-manifest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip aws

      - name: Cleanup old builds
        run: |
          echo "=== Cleaning up R2 builds - keeping 3 newest versions ==="

          # Get all items in companion folder (files and folders)
          ALL_ITEMS=$(aws s3 ls s3://${{ env.R2_BUCKET }}/companion/ \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --region auto \
            | awk '{print $4}')

          # 1. Extract versions from flat filenames: AMOS_Companion_1.6.50_amd64.dmg
          FILE_VERSIONS=$(echo "$ALL_ITEMS" | \
            sed -E 's/AMOS_Companion_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)

          # 2. Extract versions from version folders: 1.6.50/
          FOLDER_VERSIONS=$(echo "$ALL_ITEMS" | \
            sed -E 's|^([0-9]+\.[0-9]+\.[0-9]+)/?$|\1|' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)

          # Combine and get all unique versions
          ALL_VERSIONS=$(echo -e "$FILE_VERSIONS\n$FOLDER_VERSIONS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu)

          VERSION_COUNT=$(echo "$ALL_VERSIONS" | grep -c '.')
          echo "Found $VERSION_COUNT unique versions from files and folders:"
          echo "$ALL_VERSIONS"

          # Get versions to delete (all except top 3)
          if [ "$VERSION_COUNT" -gt 3 ]; then
            # Keep top 3 versions (newest)
            TO_KEEP=$(echo "$ALL_VERSIONS" | tail -n 3)
            TO_DELETE=$(echo "$ALL_VERSIONS" | head -n -3)

            echo "Keeping versions: $TO_KEEP"
            echo "Deleting versions: $TO_DELETE"

            # Delete files and folders for old versions
            for OLD_VERSION in $TO_DELETE; do
              echo "Deleting version $OLD_VERSION..."
              # Delete flat files matching this version
              aws s3 rm s3://${{ env.R2_BUCKET }}/companion/ \
                --endpoint-url ${{ env.R2_ENDPOINT }} \
                --region auto \
                --exclude "*" \
                --include "AMOS_Companion_${OLD_VERSION}_*" \
                --recursive
              # Delete version folder
              aws s3 rm s3://${{ env.R2_BUCKET }}/companion/${OLD_VERSION}/ \
                --endpoint-url ${{ env.R2_ENDPOINT }} \
                --region auto \
                --recursive
              echo "Deleted $OLD_VERSION"
            done
          else
            echo "No cleanup needed (have $VERSION_COUNT versions, keeping 3)"
          fi

          echo "=== Cleanup complete ==="

          # List remaining
          echo "Remaining items:"
          aws s3 ls s3://${{ env.R2_BUCKET }}/companion/ \
            --endpoint-url ${{ env.R2_ENDPOINT }} \
            --region auto
