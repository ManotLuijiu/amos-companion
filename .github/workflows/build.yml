name: Build AMOS Companion

on:
  push:
    tags:
      - "companion/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0)"
        required: false
        type: string

env:
  R2_ENDPOINT: "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com"
  R2_BUCKET: "amos-releases"
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
  AWS_DEFAULT_REGION: "auto"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: write

jobs:
  # Build for macOS (Intel and Apple Silicon)
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            arch: aarch64
            suffix: aarch64
            target: aarch64-apple-darwin
          - platform: macos-14
            arch: x86_64
            suffix: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust targets
        if: matrix.arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri build --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Find DMG
        id: find-dmg
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" -type f | grep bundle | head -1)
          echo "dmg_path=$DMG" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG"

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /
          rm -f AWSCLIV2.pkg

      - name: Upload to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          ARCH=${{ matrix.suffix }}
          aws s3 cp "${{ steps.find-dmg.outputs.dmg_path }}" "s3://${{ env.R2_BUCKET }}/companion/AMOS_Companion_${VERSION}_${ARCH}.dmg" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: AMOS_Companion_${VERSION}_${ARCH}.dmg"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-dmg.outputs.dmg_path }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  # Build for Linux (AppImage)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri build

      - name: Find AppImage
        id: find-appimage
        run: |
          APPIMAGE=$(find src-tauri/target -name "*.AppImage" -type f | grep bundle | head -1)
          echo "appimage_path=$APPIMAGE" >> $GITHUB_OUTPUT
          echo "Found AppImage: $APPIMAGE"

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip aws

      - name: Upload to R2
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#companion/}"
          VERSION="${VERSION#v}"
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          aws s3 cp "${{ steps.find-appimage.outputs.appimage_path }}" "s3://${{ env.R2_BUCKET }}/companion/AMOS_Companion_${VERSION}_amd64.AppImage" \
            --endpoint-url "${{ env.R2_ENDPOINT }}" \
            --region auto \
            --acl public-read
          echo "Uploaded: AMOS_Companion_${VERSION}_amd64.AppImage"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-appimage.outputs.appimage_path }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  # Build for Windows (NSIS installer)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri app
        run: bun run tauri build

      - name: Find EXE Installer
        id: find-exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target -Filter "*.exe" -Recurse | Where-Object { $_.FullName -match "bundle" -and $_.FullName -notmatch "WebView2" } | Select-Object -First 1
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found EXE: $($exe.FullName)"

      - name: Install AWS CLI
        shell: pwsh
        run: msiexec /i https://awscli.amazonaws.com/AWSCLIV2.msi /qn

      - name: Upload to R2
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $version = $version -replace "^companion/", ""
          $version = $version -replace "^v", ""
          if ("${{ inputs.version }}") {
            $version = "${{ inputs.version }}"
          }
          aws s3 cp "${{ steps.find-exe.outputs.exe_path }}" "s3://${{ env.R2_BUCKET }}/companion/AMOS_Companion_${version}_x64-setup.exe" `
            --endpoint-url "${{ env.R2_ENDPOINT }}" `
            --region auto `
            --acl public-read
          Write-Host "Uploaded: AMOS_Companion_${version}_x64-setup.exe"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-exe.outputs.exe_path }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}
