name: Update Version

on:
  push:
    tags:
      - "companion/v*"

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/companion/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update version.txt
        run: |
          echo "${{ steps.version.outputs.version }}" > version.txt
          echo "Updated version.txt"

      - name: Update version in config files
        run: |
          bun run scripts/update-version.ts

      - name: Commit and push version changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update version to ${{ steps.version.outputs.version }}"
          file_pattern: "version.txt src-tauri/Cargo.toml package.json src-tauri/tauri.conf.json"
