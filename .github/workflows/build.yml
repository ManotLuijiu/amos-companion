name: Build AMOS Companion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            arch: aarch64
            suffix: aarch64
            target: aarch64-apple-darwin
          - platform: macos-14
            arch: x86_64
            suffix: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust targets
        if: matrix.arch == 'x86_64'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ -z "$VERSION" ] && VERSION="0.2.0"
          ARCH=${{ matrix.suffix }}
          aws s3 cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/" "s3://amos-releases/companion/" \
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" \
            --region auto \
            --acl public-read \
            --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          [ -z "$VERSION" ] && VERSION="0.2.0"
          aws s3 cp "src-tauri/target/release/bundle/appimage/" "s3://amos-releases/companion/" \
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" \
            --region auto \
            --acl public-read \
            --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Install AWS CLI
        run: pip install awscli

      - name: Upload to R2
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          if (-not $version) { $version = "0.2.0" }
          aws s3 cp "src-tauri/target/release/bundle/msi/" "s3://amos-releases/companion/" `
            --endpoint-url "https://099898c1732970101eda4c9f399058c8.r2.cloudflarestorage.com" `
            --region auto `
            --acl public-read `
            --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
