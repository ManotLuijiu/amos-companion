[package]
name = "amos-companion"
version = "1.6.7"
description = "AMOS Companion — connect Android devices to AMOS with one click"
authors = ["AMOS"]
edition = "2021"

[lib]
name = "amos_companion_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "1.6.6", features = [] }

[dependencies]
tauri = { version = "1.6.6", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1.6.6", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.6.6", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "1.6.6", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "1.6.6", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
uuid = { version = "1.6.6", features = ["v4"] }
toml = "0.8"
thiserror = "1"
open = "5"
base64 = "0.22"
hostname = "0.4"
percent-encoding = "2"
md5 = "0.8"
png = "0.17"
